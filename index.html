<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Резултати от избори 2026 — карта и таблица</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Избори „Президент и вицепрезидент 10.2026“ — тур 1</h1>
    <span id="stats-line" class="muted"></span>
    <nav class="tabs">
      <button data-tab="map" class="tab active">Карта</button>
      <button data-tab="table" class="tab">Таблица</button>
    </nav>
  </header>

  <div class="filters">
    <input id="search" type="search" placeholder="Търсене (район / населено място)…" autocomplete="off" />
    <label class="unit">
      Ред:
      <select id="unit">
        <option value="districts" selected>Райони (32)</option>
        <option value="settlements">Населени места</option>
      </select>
    </label>
    <button id="points-toggle" class="chip" title="Показване на точковите маркери върху хороплет картата">Точкови маркери</button>
    <div class="party-chips" id="party-chips" title="Кои партии да се показват като колони в таблицата"></div>
  </div>

  <main>
    <section id="map-view" class="view active">
      <div id="map"></div>
      <div id="map-detail" class="detail hidden"></div>
    </section>

    <section id="table-view" class="view">
      <div class="table-wrap">
        <table id="results">
          <thead><tr id="thead"></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="legend" class="legend hidden"></div>
  <p id="status" class="muted"></p>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="app.js"></script>
</body>
</html>
