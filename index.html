<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Резултати от избори за президент и вицепрезидент 2026 — карта и таблица</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.1/dist/leaflet.css" />
  <link rel="stylesheet" href="./vendor/leaflet.markercluster/src/MarkerCluster.css" />
  <link rel="stylesheet" href="./vendor/leaflet.markercluster/src/MarkerCluster.Default.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="icon.png" />
  <script>
    // Resolve the theme before first paint (avoids a flash of the wrong palette):
    // explicit choice from a previous visit, else the OS preference, else light.
    (function () {
      var theme = 'light';
      try {
        var saved = localStorage.getItem('theme');
        if (saved === 'light' || saved === 'dark') theme = saved;
        else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
      } catch (e) {
        /* storage blocked — fall back to light */
      }
      document.documentElement.dataset.theme = theme;
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <h1>Избори „Президент и вицепрезидент 25.10.2026“ — тур 1</h1>
    <div class="segmented-control theme-switch" id="theme-switch" role="group" aria-label="Тема на сайта">
      <button type="button" class="seg-btn" data-theme-value="light" title="Светла тема" aria-label="Светла тема" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="4.6" />
          <g stroke-width="1.8" stroke-linecap="round">
            <path d="M12 2.4v2.2" /><path d="M12 19.4v2.2" />
            <path d="M2.4 12h2.2" /><path d="M19.4 12h2.2" />
            <path d="M5.2 5.2l1.6 1.6" /><path d="M17.2 17.2l1.6 1.6" />
            <path d="M18.8 5.2l-1.6 1.6" /><path d="M6.8 17.2l-1.6 1.6" />
          </g>
        </svg>
      </button>
      <button type="button" class="seg-btn" data-theme-value="dark" title="Тъмна тема" aria-label="Тъмна тема" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M20.6 14.4A8.9 8.9 0 0 1 9.6 3.4a8.9 8.9 0 1 0 11 11z" />
        </svg>
      </button>
    </div>
  </header>

  <div class="filters">
    <!-- View switcher: Map vs Table -->
    <nav class="tabs segmented-control">
      <button data-tab="map" class="seg-btn tab active" aria-label="Карта" title="Карта" aria-pressed="true">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>
        <span class="seg-label">Карта</span>
      </button>
      <button data-tab="table" class="seg-btn tab" aria-label="Таблица" title="Таблица" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M3 9h18M9 9v11M15 9v11"/></svg>
        <span class="seg-label">Таблица</span>
      </button>
    </nav>

    <!-- Common: unit switcher (districts vs settlements) -->
    <div class="segmented-control" id="unit-mode">
      <button type="button" class="seg-btn active" data-unit="districts" aria-label="Райони" title="Райони" aria-pressed="true">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 21s-6-5.2-6-10a6 6 0 0 1 12 0c0 4.8-6 10-6 10z"/><circle cx="12" cy="11" r="2.2"/></svg>
        <span class="seg-label">Райони</span>
      </button>
      <button type="button" class="seg-btn" data-unit="settlements" aria-label="Населени места" title="Населени места" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>
        <span class="seg-label">Населени места</span>
      </button>
    </div>

    <!-- Map controls: choropleth vs dots switcher -->
    <div id="map-controls" class="filter-group">
      <div class="segmented-control" id="map-mode">
        <button type="button" class="seg-btn active" data-mode="choropleth" aria-label="Полигони" title="Полигони" aria-pressed="true">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 4l8 4-3 11H7L4 8z"/></svg>
          <span class="seg-label">Полигони</span>
        </button>
        <button type="button" class="seg-btn" data-mode="dots" aria-label="Точки" title="Точки" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="6" cy="6" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/><circle cx="12" cy="12" r="2"/></svg>
          <span class="seg-label">Точки</span>
        </button>
      </div>
    </div>

    <!-- Table controls: search and candidate columns -->
    <div id="table-controls" class="filter-group hidden">
      <input id="search" type="search" placeholder="Търсене (район / населено място)…" autocomplete="off" />
      <div class="party-chips" id="party-chips" title="Кои кандидати да се показват като колони в таблицата"></div>
    </div>
  </div>

  <main>
    <section id="map-view" class="view active">
      <div id="map"></div>
      <div id="map-detail" class="detail" role="region" aria-label="Разбивка на резултатите">
        <div class="detail-titlebar">
          <button type="button" class="detail-back hidden" id="detail-back" aria-label="Общо" title="Общо">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 6l-6 6 6 6"/></svg>
          </button>
          <button type="button" class="detail-toggle" id="detail-toggle" aria-expanded="true" aria-controls="map-detail-body">
            <span class="detail-title" id="detail-title"></span>
            <svg class="detail-chevron" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 9l6 6 6-6"/></svg>
          </button>
        </div>
        <div id="map-detail-body" class="detail-body"></div>
      </div>
    </section>

    <section id="table-view" class="view">
      <div class="table-wrap">
        <table id="results">
          <thead><tr id="thead"></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="status" class="muted" role="status"></div>

  <script type="importmap">
    {"imports": {"leaflet": "https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.1/dist/leaflet.js"}}
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
