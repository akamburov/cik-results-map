<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Резултати от избори 2026 — карта и таблица</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Избори „Президент и вицепрезидент 10.2026“ — тур 1</h1>
  </header>

  <div class="filters">
    <!-- View switcher: Map vs Table -->
    <nav class="tabs segmented-control">
      <button data-tab="map" class="seg-btn tab active">Карта</button>
      <button data-tab="table" class="seg-btn tab">Таблица</button>
    </nav>

    <!-- Common: unit switcher (districts vs settlements) -->
    <div class="segmented-control" id="unit-mode">
      <button type="button" class="seg-btn active" data-unit="districts">Райони</button>
      <button type="button" class="seg-btn" data-unit="settlements">Населени места</button>
    </div>

    <!-- Map controls: choropleth vs dots switcher -->
    <div id="map-controls" class="filter-group">
      <div class="segmented-control" id="map-mode">
        <button type="button" class="seg-btn active" data-mode="choropleth">Полигони</button>
        <button type="button" class="seg-btn" data-mode="dots">Точки</button>
      </div>
    </div>

    <!-- Table controls: search and candidate columns -->
    <div id="table-controls" class="filter-group hidden">
      <input id="search" type="search" placeholder="Търсене (район / населено място)…" autocomplete="off" />
      <div class="party-chips" id="party-chips" title="Кои кандидати да се показват като колони в таблицата"></div>
    </div>
  </div>

  <main>
    <section id="map-view" class="view active">
      <div id="map"></div>
      <div id="map-detail" class="detail hidden"></div>
    </section>

    <section id="table-view" class="view">
      <div class="table-wrap">
        <table id="results">
          <thead><tr id="thead"></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="legend" class="legend"></div>
  <footer id="footer">
    <span id="stats-line" class="muted"></span>
    <span id="status" class="muted"></span>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="app.js"></script>
</body>
</html>
