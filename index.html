<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Резултати от избори за президент и вицепрезидент 2026 — карта и таблица</title>
  <!-- Leaflet is vendored (no CDN): third-party unpkg requests trip browser
       tracking prevention and break offline / privacy-hardened setups. -->
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="vendor/leaflet-markercluster/MarkerCluster.css" />
  <link rel="stylesheet" href="vendor/leaflet-markercluster/MarkerCluster.Default.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="icon.png" />
  <script>
    // Resolve the theme before first paint (avoids a flash of the wrong palette):
    // explicit choice from a previous visit, else the OS preference, else light.
    (function () {
      var theme = 'light';
      try {
        var saved = localStorage.getItem('theme');
        if (saved === 'light' || saved === 'dark') theme = saved;
        else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
      } catch (e) {
        /* storage blocked — fall back to light */
      }
      document.documentElement.dataset.theme = theme;
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <h1>Избори „Президент и вицепрезидент 25.10.2026“ — тур 1</h1>
    <div class="segmented-control theme-switch" id="theme-switch" role="group" aria-label="Тема на сайта">
      <button type="button" class="seg-btn" data-theme-value="light" title="Светла тема" aria-label="Светла тема" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="4.6" />
          <g stroke-width="1.8" stroke-linecap="round">
            <path d="M12 2.4v2.2" /><path d="M12 19.4v2.2" />
            <path d="M2.4 12h2.2" /><path d="M19.4 12h2.2" />
            <path d="M5.2 5.2l1.6 1.6" /><path d="M17.2 17.2l1.6 1.6" />
            <path d="M18.8 5.2l-1.6 1.6" /><path d="M6.8 17.2l-1.6 1.6" />
          </g>
        </svg>
      </button>
      <button type="button" class="seg-btn" data-theme-value="dark" title="Тъмна тема" aria-label="Тъмна тема" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M20.6 14.4A8.9 8.9 0 0 1 9.6 3.4a8.9 8.9 0 1 0 11 11z" />
        </svg>
      </button>
    </div>
  </header>

  <div class="filters">
    <!-- View switcher: Map vs Table -->
    <nav class="tabs segmented-control">
      <button data-tab="map" class="seg-btn tab active">Карта</button>
      <button data-tab="table" class="seg-btn tab">Таблица</button>
    </nav>

    <!-- Common: unit switcher (districts vs settlements) -->
    <div class="segmented-control" id="unit-mode">
      <button type="button" class="seg-btn active" data-unit="districts">Райони</button>
      <button type="button" class="seg-btn" data-unit="settlements">Населени места</button>
    </div>

    <!-- Map controls: choropleth vs dots switcher -->
    <div id="map-controls" class="filter-group">
      <div class="segmented-control" id="map-mode">
        <button type="button" class="seg-btn active" data-mode="choropleth">Полигони</button>
        <button type="button" class="seg-btn" data-mode="dots">Точки</button>
      </div>
    </div>

    <!-- Table controls: search and candidate columns -->
    <div id="table-controls" class="filter-group hidden">
      <input id="search" type="search" placeholder="Търсене (район / населено място)…" autocomplete="off" />
      <div class="party-chips" id="party-chips" title="Кои кандидати да се показват като колони в таблицата"></div>
    </div>
  </div>

  <main>
    <section id="map-view" class="view active">
      <div id="map"></div>
      <div id="map-detail" class="detail hidden" style="position: relative;"></div>
    </section>

    <section id="table-view" class="view">
      <div class="table-wrap">
        <table id="results">
          <thead><tr id="thead"></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="legend" class="legend"></div>
  <footer id="footer">
    <span id="stats-line" class="muted"></span>
    <span id="status" class="muted"></span>
  </footer>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/leaflet-markercluster/leaflet.markercluster.js"></script>
  <script src="app.js"></script>
</body>
</html>
