name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # NOTE: raw CIK exports (Exports/) are gitignored, so we cannot regenerate
      # data/*.json here; instead validate the invariants the viewer relies on.
      - name: Validate data invariants
        run: node scripts/validate-data.mjs
      - name: Validate choropleth geometry
        run: node .agents/skills/geo-processing/scripts/check-geo.mjs

  deploy:
    needs: verify-data
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
